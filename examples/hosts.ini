# Example gpu-fleet config. Copy to ~/.config/gpu-fleet/hosts.ini
# (or run `gpu-fleet init`) and edit.
#
# One [section] per machine:
#   ssh  = "user@host", a ~/.ssh/config alias, or "local" for this machine.
#   type = auto (default) | nvidia | jetson    -- usually leave as auto.
#
# Tip: with Tailscale you can just use the tailnet name as the host, so the
# fleet is reachable from anywhere without opening ports.

[local]
ssh = local

[aurora-server]
ssh = user@aurora-server

# A Jetson has no nvidia-smi; gpu-fleet reads its GPU from sysfs automatically.
[jetson-xavier]
ssh = user@jetson-xavier
type = jetson
