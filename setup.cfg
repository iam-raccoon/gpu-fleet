[metadata]
name = gpu-fleet
version = 0.1.0
description = Live multi-machine NVIDIA GPU dashboard over SSH — one terminal view for your whole fleet.
long_description = file: README.md
long_description_content_type = text/markdown
author = iamracco0n
url = https://github.com/iamracco0n/gpu-fleet
license = MIT
license_files = LICENSE
keywords = gpu, nvidia, nvidia-smi, jetson, monitoring, ssh, dashboard, tui
classifiers =
    Environment :: Console
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Programming Language :: Python :: 3
    Topic :: System :: Monitoring

[options]
packages = gpu_fleet
python_requires = >=3.8
install_requires =
    rich>=13.0

[options.entry_points]
console_scripts =
    gpu-fleet = gpu_fleet.cli:main
